[project]
name = "muse-personal-agent"
version = "0.3.0rc4"
description = "MUSE Python personal assistant for coding, research, documents and background tasks"
requires-python = ">=3.12"
dependencies = [
    "textual>=2.1.0",
    "anthropic>=0.47.0",
    "openai>=1.60.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "mcp>=1.12.0",
    "httpx>=0.27.0",
    "websockets>=14.0",
    "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<3",
    "httpx[socks]>=0.27,<1", "beautifulsoup4>=4.12,<5", "pypdf>=5,<7",
    "playwright>=1.48,<2", "psutil>=6,<8", "jsonschema>=4.23,<5",
]

[project.scripts]
mewcode = "mewcode.__main__:main"
muse = "muse.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["mewcode", "src/muse"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.9,<1", "reportlab>=4,<5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests/muse/unit", "tests/muse/integration", "tests"]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
markers = ["timeout: upstream timeout annotation (external live test is disabled)"]
